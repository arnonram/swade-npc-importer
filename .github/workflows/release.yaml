name: Mod Builder
description: |
  This workflow builds the mod and creates a release when a new tag is pushed.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn
      - run: yarn build
      - name: Zip Files
        working-directory: ./
        run: zip -r ./module.zip ./dist/*
      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1.16.0
        with:
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{secrets.GITHUB_TOKEN}}
          generateReleaseNotes: true
          artifacts: ./module.zip, ./module.json
